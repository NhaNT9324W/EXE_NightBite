# =============================================================================
# PRODUCTION PROFILE – Render / Railway
# Kích hoạt bằng: SPRING_PROFILES_ACTIVE=prod
# Tất cả giá trị nhạy cảm PHẢI set qua environment variables trên dashboard
# =============================================================================

# Database – set trên Render/Railway dashboard
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# HikariCP production tuning
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA – tắt SQL log trong production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=update

# JWT – PHẢI set JWT_SECRET trên dashboard (>= 32 ký tự)
app.jwt.secret=${JWT_SECRET}

# CORS – domain của FE Zalo Cloud
app.cors.allowed-origins=${CORS_ORIGINS:https://your-zalo-mini-app.zalo.me}

# Firebase
app.firebase.credentials-file=${FIREBASE_CREDENTIALS_FILE:firebase-service-account.json}

# Logging
logging.level.root=WARN
logging.level.com.nightbite=INFO
