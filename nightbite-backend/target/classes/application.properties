spring.application.name=nightbite-backend

# =============================================================================
# DATABASE - MySQL (local dev)
# Production: override via environment variables (DB_URL, DB_USER, DB_PASS)
# =============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nightbite_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:123456}

# =============================================================================
# HIKARICP - Connection Pool
# =============================================================================
spring.datasource.hikari.pool-name=NightBitePool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =============================================================================
# JPA / HIBERNATE (Code First)
# =============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.connection.charSet=UTF-8
spring.jpa.open-in-view=false

# =============================================================================
# SERVER
# =============================================================================
server.port=${PORT:8080}
server.servlet.context-path=/savibite

# =============================================================================
# JWT (BE-17)
# Production: override JWT_SECRET via environment variable
# =============================================================================
app.jwt.secret=${JWT_SECRET:NightBite_SuperSecret_Key_2026_MustBe256BitsLong_EXE101FPT}
app.jwt.access-token-expiration=86400000
app.jwt.refresh-token-expiration=604800000

# =============================================================================
# SWAGGER / SPRINGDOC (BE-09)
# =============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# =============================================================================
# FIREBASE (BE-25 - Push Notification, Sprint 3)
# =============================================================================
app.firebase.credentials-file=${FIREBASE_CREDENTIALS_FILE:firebase-service-account.json}

# =============================================================================
# CORS (FE dev server)
# =============================================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
